<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Swiss Minimal</title>
  <style>
    /* TOKENS */
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1f1f1f;
      --text-primary: #ffffff;
      --text-secondary: #9b9b9b;
      --accent: #dc2626;
      --accent-hover: #b91c1c;
    }

    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font: inherit;
    }

    /* BASE */
    html {
      font-size: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* LAYOUT */
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: clamp(2rem, 6vw, 3rem);
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    /* HEADER */
    .card-header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-title {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* FORM */
    .form {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .field-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .field-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.625rem 0;
      font-size: 0.95rem;
      transition: border-color 160ms ease;
    }

    .field-input::placeholder {
      color: var(--text-secondary);
    }

    .field-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
    }

    /* ACTIONS */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.875rem;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
    }

    .check-input {
      width: 1rem;
      height: 1rem;
      accent-color: var(--accent);
    }

    .link {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 160ms ease;
    }

    .link:hover {
      color: var(--accent);
    }

    /* BUTTON */
    .btn {
      width: 100%;
      border: none;
      background: var(--accent);
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 1rem;
      cursor: pointer;
      transition: background 160ms ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    /* FOOTER */
    .card-footer {
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .link-strong {
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 0.125rem;
      transition: color 160ms ease;
    }

    .link-strong:hover {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <header class="card-header">
        <h1 class="card-title">Login</h1>
        <p class="card-subtitle">Acesse sua conta</p>
      </header>

      <form class="form">
        <div class="field-group">
          <div class="field">
            <label class="field-label" for="email">E-mail</label>
            <input class="field-input" id="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label class="field-label" for="password">Senha</label>
            <input class="field-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>

        <div class="form-row">
          <label class="check">
            <input class="check-input" id="remember" type="checkbox">
            <span>Lembrar-me</span>
          </label>
          <a class="link" href="#">Esqueceu a senha?</a>
        </div>

        <button class="btn" type="submit">Entrar</button>
      </form>

      <footer class="card-footer">
        Não tem uma conta? <a class="link-strong" href="#">Cadastre-se</a>
      </footer>
    </section>
  </main>
</body>

</html>
