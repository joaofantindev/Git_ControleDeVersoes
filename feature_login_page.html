<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --text-primary: #ffffff;
            --text-secondary: #a1a1a1;
            --accent: #dc2626;
            --accent-hover: #b91c1c;
            --border: #1f1f1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            line-height: 1.6;
            letter-spacing: -0.01em;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 48px 40px;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            background-color: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            color: var(--text-primary);
            font-size: 15px;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 13px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .checkbox-group label {
            color: var(--text-secondary);
        }

        .forgot-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--accent);
        }

        .login-button {
            width: 100%;
            background-color: var(--accent);
            color: var(--text-primary);
            border: none;
            padding: 16px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-weight: 500;
        }

        .login-button:hover {
            background-color: var(--accent-hover);
        }

        .signup-text {
            text-align: center;
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .signup-link {
            color: var(--text-primary);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
            transition: color 0.2s ease;
        }

        .signup-link:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Login</h1>
            <p>Acesse sua conta</p>
        </div>
        
        <form>
            <div class="form-group">
                <label class="form-label" for="email">E-mail</label>
                <input class="form-input" type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Senha</label>
                <input class="form-input" type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="form-actions">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar-me</label>
                </div>
                <a href="#" class="forgot-link">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="login-button">Entrar</button>
        </form>
        
        <p class="signup-text">
            Não tem uma conta? <a href="#" class="signup-link">Cadastre-se</a>
        </p>
    </div>
</body>
</html>
